# Mirrors `main` to the public GitHub repo after every merge.
#
# Bitbucket stays the source of truth. GitHub is a read-only mirror that exists
# so the `repository:` link on pub.dev resolves for people outside the org —
# the Bitbucket repo is private, so an outside consumer clicking through from
# pub.dev gets a 404.
#
# This runs in CI rather than as a local git config because PR merges happen
# server-side in the Bitbucket UI and never reach a developer's machine. A
# second push URL on `origin` would only cover pushes made by hand.
#
# Setup — Repository settings -> Repository variables:
#
#   GITHUB_TOKEN   secured. A GitHub PAT with `repo` scope, or a fine-grained
#                  token scoped to AAU-IQ/scanmynet-flutter with
#                  Contents: read & write.
#
# If the push is ever rejected as non-fast-forward, someone has committed
# directly to GitHub. Reconcile by hand — do not add --force here, or that work
# is destroyed silently on the next merge.

image: atlassian/default-image:4

clone:
  # A mirror needs the real history. The default shallow clone (depth 50) makes
  # the push to GitHub non-fast-forward as soon as the repo outgrows it.
  depth: full

pipelines:
  branches:
    main:
      - step:
          name: Mirror main to GitHub
          clone:
            depth: full
          script:
            - git push --follow-tags
              "https://x-access-token:$GITHUB_TOKEN@github.com/AAU-IQ/scanmynet-flutter.git"
              HEAD:main
