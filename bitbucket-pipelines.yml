# Mirrors `main` to the public GitHub repo after every merge.
#
# Bitbucket stays the source of truth. GitHub is a read-only mirror that exists
# so the `repository:` link on pub.dev resolves for people outside the org —
# the Bitbucket repo is private, so an outside consumer clicking through from
# pub.dev gets a 404.
#
# This runs in CI rather than as a local git config because PR merges happen
# server-side in the Bitbucket UI and never reach a developer's machine. A
# second push URL on `origin` would only cover pushes made by hand, which is
# how the mirror previously fell 19 commits behind.
#
# Setup — one key, two pages, no access token:
#
#   1. Bitbucket -> Repository settings -> Pipelines -> SSH keys -> Generate
#      keys. Bitbucket keeps the private half encrypted and injects it into the
#      build container; it is never exposed here or in the logs.
#   2. Copy the public key it shows into https://github.com/settings/keys.
#      That is a personal account key, so it needs no org permission — the
#      account only has to have push access to the repo.
#   3. Same Bitbucket page, under Known hosts: enter `github.com` and Fetch.
#      Without this the push fails host verification.
#
# An access token would work too, but a classic PAT reaches every repo the
# account can see and expires on a date nobody remembers — the mirror would go
# quietly stale again. This key is scoped to one destination and does not
# expire.
#
# If the push is ever rejected as non-fast-forward, someone has committed
# directly on GitHub. Reconcile by hand — do not add --force here, or that work
# is destroyed silently on the next merge.

image: atlassian/default-image:4

pipelines:
  branches:
    main:
      - step:
          name: Mirror main to GitHub
          clone:
            # A mirror needs the real history. The default shallow clone
            # (depth 50) makes the push non-fast-forward once the repo
            # outgrows it.
            depth: full
          script:
            - git push --follow-tags
              git@github.com:AAU-IQ/scanmynet-flutter.git
              HEAD:main
